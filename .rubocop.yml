AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Gemspec/DevelopmentDependencies:
  Enabled: false

# Size and complexity cleanup is explicitly deferred from this lint-contract
# change. Tighten metrics one component at a time after behavior is locked.
Metrics:
  Enabled: false

# Test doubles keep production keyword names to make their protocol contracts
# visible, even when a particular example does not inspect every argument.
Lint/UnusedBlockArgument:
  Exclude:
    - "test/**/*"

Lint/UnusedMethodArgument:
  Exclude:
    - "test/**/*"

# Item owns this validation constant inside its Data-defined class body.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "lib/agent/session_context/item.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# The subclass form keeps Config's constants scoped to Config. RuboCop's
# autocorrection to a Data.define block moves them to Agent::SessionContext.
Style/DataInheritance:
  Exclude:
    - "lib/agent/session_context/config.rb"
